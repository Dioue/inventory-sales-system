{% load static %}

<!-- Modal toggle -->
  <!-- Main modal -->
  <div id="client-form" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-2xl max-h-full">
        <!-- Modal content -->
        <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
            <!-- Modal header -->
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                  <h3 class="client-form-text text-lg font-semibold text-gray-900 dark:text-white">
                      Client Form
                  </h3>
                  <h6 class="client-form-id ml-1 text-sm font-normal text-gray-500 dark:text-white">
                  </h6>
                <button type="button" class="client-form-hide-btn text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-hide="client-form">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <!-- Modal body -->
            <div class="p-4 md:p-5 space-y-4">
                <div class="grid grid-cols-4 gap-4 mb-4">
                    <div class="col-span-2">
                        <label for="client-label" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Client Name<span class="text-red-400">*</span></label>
                        <input id="client-name" type="text" name="client" 
                        class="shadow-md rounded-lg w-100 bg-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                        placeholder="Enter client name" required="true" maxlength="60" oninput="toTitleCase(this)">
                    </div>
                    <div class="col-span-2">
                        <label for="client-city-label" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">City<span class="text-red-400">*</span></label>
                        <input id="client-city" type="text" name="city" 
                        class="shadow-md rounded-lg w-100 bg-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                        placeholder="e.g., Carmona City" required="true" maxlength="60" oninput="toTitleCase(this)">
                    </div>
                </div>
                <div class="grid grid-cols-4 gap-4 mb-4">
                    <div class="col-span-2">
                        <label for="client-provice-label" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Province<span class="text-red-400">*</span></label>
                        <input id="client-province" type="text" name="province" 
                        class="shadow-md rounded-lg w-100 bg-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                        placeholder="e.g., Cavite" required="true" maxlength="60" oninput="toTitleCase(this)">
                    </div>
                    <div class="col-span-2">
                        <label for="client-zip-label" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Zip Code<span class="text-red-400">*</span></label>
                        <input id="client-zip" type="text" name="zip_code" 
                        class="shadow-md rounded-lg w-100 bg-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                        placeholder="e.g., 4116" required="true" maxlength="4" oninput="sanitizeZipCode(this)">
                    </div>
                </div>
                <div class="grid grid-cols-4 gap-4 mb-4">
                    <div class="col-span-2">
                        <label for="client-address-1-label" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Address line 1<span class="text-red-400">*</span></label>
                        <input id="client-address-1" type="text" name="address_line_1" 
                        class="shadow-md rounded-lg w-100 bg-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                        placeholder="e.g., house or building number, street name" required="true" maxlength="120">
                    </div>
                    <div class="col-span-2">
                        <label for="client-address-2-label" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Address line 2<span class="font-italic text-gray-600 text-xs"> (Optional)</span></label>
                        <input id="client-address-2" type="text" name="address_line_2" 
                        class="shadow-md rounded-lg w-100 bg-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                        placeholder="e.g., apartment, suite, or floor numbers, or a PO Box number" required="true" maxlength="120">
                    </div>
                </div>
                <div class="flex">
                    <button id="client-submit" type="button" class="ml-auto text-white inline-flex items-center text-white bg-green-500 hover:bg-green-700 focus:outline-none focus:ring-4 focus:ring-green-300 font-medium rounded-full text-sm px-5 py-2.5 text-center me-2 mb-2 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">
                        <svg class="mr-1 -ml-1 w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"></path>
                        </svg>
                        Update Client
                    </button>   
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'components/modals/client/confirm_popup.html' %}
