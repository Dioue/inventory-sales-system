{% load static %}

<!-- Modal toggle -->
  <!-- Main modal -->
  <div id="delivery-form" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-2xl max-h-full">
        <!-- Modal content -->
        <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
            <!-- Modal header -->
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                  <h3 id="delivery-form-text" class="text-lg font-semibold text-gray-900 dark:text-white">
                      delivery Form
                  </h3>
                  <h6 id="delivery-form-id" class="ml-1 text-sm font-normal text-gray-500 dark:text-white">
                  </h6>
                <button type="button" class="delivery-form-hide text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-hide="delivery-form">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <!-- Modal body -->
            <form id="delivery-form-control">
            <div class="p-4 md:p-5 space-y-4">
                <div class="grid grid-cols-4 gap-4 mb-4">
                    <div class="col-span-2">
                        <label for="delivery-form-delivery" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Sales Record<span class="text-red-400">*</span></label>
                        <select id="delivery-form-delivery"  name="sale" class="shadow-md rounded-lg w-100 bg-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                            <option selected="" disabled>Select a sale record</option>
                            {% if tables.delivery_record %}
                                {% for d in tables.delivery_record%}
                                <option value={{d.id}}>{{d.id}} - {{d.client}}</option>
                                {% endfor %}
                            {% endif %}
                        </select>
                    </div>
                    <div class="relative max-w-sm col-span-2">
                        <label for="delivery-form-issued" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Delivery Date<span class="text-red-400">*</span></label>
                        <input id="delivery-form-issued" name="delivery_date" datepicker datepicker-autohide type="text" datepicker-min-date="01/01/2022" class="shadow-md rounded-lg w-100 bg-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Select a date">
                    </div>
                    <div class="relative max-w-sm col-span-2">
                        <label for="delivery-form-claimed" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Date claimed<span class="text-red-400">*</span></label>
                        <input id="delivery-form-claimed" name="date_claimed" datepicker datepicker-autohide type="text" datepicker-min-date="01/01/2022" class="shadow-md rounded-lg w-100 bg-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Select a date">
                    </div>
                </div>
                <div class="flex">
                    <button id="delivery-form-submit" type="button" class="ml-auto text-white inline-flex items-center text-white bg-green-500 hover:bg-green-700 focus:outline-none focus:ring-4 focus:ring-green-300 font-medium rounded-full text-sm px-5 py-2.5 text-center me-2 mb-2 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">
                        <svg class="mr-1 -ml-1 w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"></path>
                        </svg>
                        Update delivery
                    </button>   
                </div>
            </div>
            </form>
        </div>
    </div>
</div>

{% include 'components/modals/delivery/confirm_popup.html' %}
<script src="{% static 'js/input_functions.js' %}"></script>
