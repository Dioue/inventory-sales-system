

<!-- Modal toggle -->
  <!-- Main modal -->
  <div id="default_item_view" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
      <div class="relative p-4 w-8/12 max-h-full">
          <!-- Modal content -->
          <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
              <!-- Modal header -->
              <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                    <h3 class="default_view_header_text text-lg font-semibold text-gray-900 dark:text-white">
                        View details
                    </h3>
                    <h6 class="default_view_header_id ml-1 text-sm font-normal text-gray-500 dark:text-white">
                        BN-{{modal.batch_form.last_fetch_batch_id}}
                    </h6>
                  <button type="button" class="default_item_view_hide text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-hide="default_item_view">
                      <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                      </svg>
                      <span class="sr-only">Close modal</span>
                  </button>
              </div>
              <!-- Modal body -->
              <div class="p-4 md:p-5 space-y-4">
                <div class="grid gap-4 mb-4 grid-cols-2 text-black">
                    <p class="text-base leading-relaxed col-span-1">
                        Batch Number: <span id="view_batch_id" class="text-sm text-gray-600"></span>
                    </p>
                    <p class="text-base leading-relaxed col-span-1">
                        Purchase Total: <span id="view_gt" class="text-sm text-gray-600"></span>
                    </p>
                    <p class="text-base leading-relaxed">
                        Supplier Name: <span id="view_sn" class="text-sm text-gray-600"></span>
                    </p>
                    <p class="text-base leading-relaxed">
                        Purchase Date: <span id="view_pd" class="text-sm text-gray-600"></span>
                    </p>
                </div>
                {% include 'components/list_tables/batch_view.html' %}
              </div>
          </div>
      </div>
  </div>
