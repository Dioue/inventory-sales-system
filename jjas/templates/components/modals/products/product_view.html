

<!-- Modal toggle -->
  <!-- Main modal -->
  <div id="product_view" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-4xl max-h-full">
        <!-- Modal content -->
        <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
            <!-- Modal header -->
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                  <h3 class="product_view_header_text text-lg font-semibold text-gray-900 dark:text-white">
                      View details
                  </h3>
                  <h6 class="product_view_header_id ml-1 text-sm font-normal text-gray-500 dark:text-white">
                      PN-{{modal.batch_form.last_fetch_batch_id}}
                  </h6>
                <button type="button" class="product_view_hide text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-hide="product_view">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <!-- Modal body -->
            <div class="p-4 md:p-5 space-y-4">
              <div class="grid gap-4 mb-4 grid-cols-3 text-black">
                <p class="text-base leading-relaxed">
                    Product Name: <span id="view_name" class="text-sm text-gray-600"></span>
                </p>
                <p class="text-base leading-relaxed">
                    Product Code: <span id="view_code" class="text-sm text-gray-600"></span>
                </p>
                <p class="text-base leading-relaxed">
                    Category Name: <span id="view_category" class="text-sm text-gray-600"></span>
                </p>
                <p class="text-base leading-relaxed">
                    Application: <span id="view_application" class="text-sm text-gray-600"></span>
                </p>
                <p class="text-base leading-relaxed">
                    Quantity: <span id="view_quantity" class="text-sm text-gray-600"></span>
                </p>
                <p class="text-base leading-relaxed">
                    Cost Price: <span id="view_cost" class="text-sm text-gray-600"></span>
                </p>
                <p class="text-base leading-relaxed">
                    Critical Level: <span id="view_critical" class="text-sm text-gray-600"></span>
                </p>
                <p class="text-base leading-relaxed">
                    Product Status: <span id="view_status" class="text-sm text-gray-600"></span>
                </p>
                <p class="text-base leading-relaxed">
                    Selling Price: <span id="view_selling" class="text-sm text-gray-600"></span>
                </p>
                
              </div>
              {% include 'components/list_tables/product_view_table.html' %}
            </div>
        </div>
    </div>
</div>
