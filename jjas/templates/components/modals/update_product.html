{% load static %}

<!-- Modal Structure -->
<div id="view_modal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-modal md:h-full">
    <div class="relative p-4 w-8/12 h-full md:h-auto">
        <!-- Modal content -->
        <div class="relative p-4 bg-white rounded-lg shadow dark:bg-gray-800 sm:p-5">
            <!-- Modal header -->
            <div class="flex justify-between items-center pb-4 mb-4 rounded-t border-b sm:mb-5 dark:border-gray-600">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                    Edit Product
                </h3>
                <h6 id="bn" class="ml-1 text-sm font-normal text-gray-500 dark:text-white">

                </h6>
                <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-toggle="view_modal">
                    <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <!-- Modal body -->
            <form action="{% url 'auth_product_component' %}" method="post" enctype="multipart/form-data">
                <!-- Hidden field for product_id -->
                <input type="hidden" name="edit_id" id="edit_id" value="">
                {% csrf_token %}
                <div class="grid gap-4 mb-4 grid-cols-2 sm:grid-cols-4">
                    <div class="col-span-1">
                        <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Product Name<span class="text-red-400">*</span></label>
                        <input type="text" name="name" id="edit_name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Automotive Part" required="true">
                    </div>
                    <div class="col-span-1">
                        <label for="code" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Product Code<span class="text-red-400">*</span></label>
                        <input type="text" name="code" id="edit_code" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="A0000A" required="true">
                    </div>
                    <div class="col-span-1">
                        <label for="application" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Application<span class="text-red-400">*</span></label>
                        <input type="text" name="application" id="edit_application" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="i.e. Toyota, Audi" required="true">
                    </div>
                    <div class="col-span-1">
                        <label for="side" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Side</label>
                        <select id="edit_side" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                            <option selected="" disabled>Select a side</option>
                            <option value="FRONT">FR - Front</option>
                            <option value="BACK">RR - Rear</option>
                        </select>
                    </div>
                    <div class="sm:col-span-2">
                        <div class="grid gap-4 grid-cols-4">
                            <div class="col-span-1">
                                <label for="cost_price" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Purchase Cost (₱)<span class="text-red-400">*</span></label>
                                <input type="number" name="cost_price" id="edit_cost_price" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="9999" required="true" min="0" >
                            </div>
                            <div class="col-span-1">
                                <label for="selling_price" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Selling Price (₱)<span class="text-red-400">*</span></label>
                                <input type="number" name="selling_price" id="edit_selling_price" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="9999" required="true" min="0" >
                            </div>
                            <div class="col-span-1">
                                <label for="quantity_left" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Quantity<span class="text-red-400">*</span></label>
                                <input type="number" name="quantity_left" id="edit_quantity_left" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="9999" required="true" min="0" >
                            </div>
                            <div class="col-span-1">
                                <label for="unit" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Unit<span class="text-red-400">*</span></label>
                                <select id="edit_unit" name="unit" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                                    <option selected="" disabled>UoM</option>
                                    {% if tables.unit.data %}
                                        {% for d in tables.unit.data %}
                                        <option value="{{d.id}}">{{d.name}}</option>
                                        {% endfor %}
                                    {% endif %}
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="sm:col-span-2">
                        <div class="grid gap-4 grid-cols-2">
                            <div class="col-span-1">
                                <label for="category" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Category<span class="text-red-400">*</span></label>
                                <select id="edit_category" name="category" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 ">
                                    <option selected="" disabled>Pick a category</option>
                                    {% if tables.category.data %}
                                        {% for d in tables.category.data %}
                                            <option value="{{d.id}}">{{d.code}} - {{d.name}}</option>
                                        {% endfor %}
                                    {% endif %}
                                </select>
                            </div>
                            <div class="col-span-1">
                                <label for="critical_level" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                                    Critical Level
                                </label>
                                <input 
                                    type="number" 
                                    name="critical_level" 
                                    id="edit_critical_level" 
                                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" 
                                    placeholder="9999" 
                                    value="0" 
                                    min="0" 
                                    required
                                >
                            </div>
                        </div>
                    </div>
                    <div class="sm:col-span-4">
                        <div class="grid gap-4 grid-cols-4">
                            <div class="col-span-1">
                                <label for="description" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Description</label>
                                <textarea id="edit_description" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Write product description here"></textarea>
                            </div>
                            <div class="col-span-1">
                                <label for="supplier" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Supplier<span class="text-red-400">*</span></label>
                                <select id="edit_supplier" name="supplier" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 ">
                                    <option selected="" disabled>Pick a category</option>
                                    {% if tables.supplier.data %}
                                        {% for d in tables.supplier.data %}
                                            <option value="{{d.id}}">{{d.name}}</option>
                                        {% endfor %}
                                    {% endif %}
                                </select>
                            </div>
                            <div class="col-span-1">
                                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Image</label>
                                <input type="file" name="image" class="block w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 cursor-pointer dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Modal footer -->
                <div class="flex justify-end pt-4 space-x-2 border-t border-gray-200 rounded-b dark:border-gray-600">
                    <button data-modal-toggle="view_modal" type="button" class="text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-4 focus:ring-red-300 font-medium rounded-full text-sm px-5 py-2.5 text-center me-2 mb-2 dark:bg-red-600 dark:hover:bg-red-700 dark:focus:ring-red-900">
                        Close
                    </button>
                    <button type="submit" class="text-white bg-green-500 hover:bg-green-700 focus:outline-none focus:ring-4 focus:ring-green-300 font-medium rounded-full text-sm px-5 py-2.5 text-center me-2 mb-2 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
