{% load static %}
<div class="max-w-full w-full bg-white rounded-lg shadow dark:bg-gray-800 p-4 pb-2 md:p-6 md:pb-2">
    <div class="flex justify-between">
      <div>
        <h5 id="salesTotal" class="leading-none text-3xl font-bold text-gray-900 dark:text-white pb-2">32.4k</h5>
        <p id="salesRange" class="text-base font-normal text-gray-500 dark:text-gray-400">sales this week</p>
      </div>
      <div class="flex justify-between items-center pt-3">
        <!-- Button -->
        <button
          id="dropdownDefaultButton_sales"
          data-dropdown-toggle="lastDaysdropdown_sales"
          data-dropdown-placement="bottom"
          class="text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-900 text-center inline-flex items-center dark:hover:text-white"
          type="button">
          Last 7 days
          <svg class="w-2.5 m-2.5 ms-1.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4"/>
          </svg>
        </button>
        <!-- Dropdown menu -->
        <div id="lastDaysdropdown_sales" class="z-50 hidden bg-white divide-y divide-gray-100 rounded-lg shadow w-44 dark:bg-gray-700">
            <ul class="py-2 text-sm text-gray-700 dark:text-gray-200" aria-labelledby="dropdownDefaultButton_sales">
              <li>
                <a href="#" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Today</a>
              </li>
              <li>
                <a href="#" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Last 7 days</a>
              </li>
              <li>
                <a href="#" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Last 30 days</a>
              </li>
            </ul>
        </div>
      </div>
    </div>
    <div id="sales-chart"></div>
  </div>
  
  <script src="{% static 'js/analytics/salesVolume.js'%}"></script>
